<style>

.sb{position:fixed;top:0;right:0;bottom:0;width:var(--sbw);background:var(--sbg);display:flex;flex-direction:column;z-index:100;transition:background .3s}
.sb-brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:20px;overflow-y:auto}.mo.show{display:flex}

.md-h{padding:16px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.md-h h3{font-size:1rem;font-weight:700}

.inv-tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin:10px 0}.inv-tbl th{background:#f8fafc;padding:8px 10px;font-weight:600;color:var(--txs);border:1px solid var(--bd);white-space:nowrap}body.dark .inv-tbl th{background:#0f172a}

.inv-tbl .it-total{font-weight:700;color:var(--p);text-align:center;min-width:90px}

.inv-ti{flex:1;min-width:120px}.inv-ti label{font-size:.73rem;color:var(--txs);font-weight:600;display:block;margin-bottom:3px}.inv-ti .val{font-size:1.05rem;font-weight:800}.inv-ti .val.g{color:var(--ok)}.inv-ti .val.r{color:var(--d)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--bd);flex-wrap:wrap}
.tab-btn{padding:8px 16px;border:none;background:transparent;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--txm);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;border-radius:8px 8px 0 0}.tab-btn:hover{color:var(--tx);background:var(--bg)}.tab-btn.active{color:var(--p);border-bottom-color:var(--p)}
.tw2{position:fixed;bottom:20px;left:20px;z-index:300;display:flex;flex-direction:column-reverse;gap:8px}
.tst{padding:12px 18px;border-radius:10px;color:#fff;font-size:.83rem;font-weight:500;box-shadow:var(--shdl);display:flex;align-items:center;gap:9px;animation:tIn .3s ease;min-width:260px}
@keyframes tIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.tst-s{background:#16a34a}.tst-e{background:#dc2626}.tst-i{background:#2563eb}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ld{display:flex;align-items:center;justify-content:center;padding:50px;color:var(--txm);gap:10px;font-size:.88rem}
.spn{width:18px;height:18px;border:2.5px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:spnA .6s linear infinite}@keyframes spnA{to{transform:rotate(360deg)}}
.sec-div{background:var(--bg);padding:10px 18px;font-size:.82rem;font-weight:700;color:var(--txs);border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}.sec-div:hover{background:var(--bd)}
.lg-sm{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.lg-box{flex:1;min-width:140px;padding:14px;border-radius:10px;text-align:center}.lg-box.bl{background:var(--pl);color:var(--p)}.lg-box.gn{background:var(--okl);color:var(--ok)}.lg-box.rd{background:var(--dl);color:var(--d)}.lg-box h4{font-size:1.2rem;font-weight:800}.lg-box p{font-size:.76rem;margin-top:2px;font-weight:600}
td.cd{color:var(--d);font-weight:600}td.cc{color:var(--ok);font-weight:600}td.bp2{color:var(--d);font-weight:700}td.bn{color:var(--ok);font-weight:700}
.pr-area{display:none}
@media print{body *{visibility:hidden}.pr-area,.pr-area *{visibility:visible}.pr-area{display:block!important;position:fixed;top:0;left:0;width:100%;background:#fff;z-index:9999}}
@media(max-width:768px){.sb{transform:translateX(100%)}.mn{margin-right:0}.fr{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}.ct{padding:14px}.md.w{max-width:100%}.tp{flex-wrap:wrap;height:auto;padding:10px 14px}}
</style>
</head>
<body>

<div id="loginPage" class="lg-page">
<div class="lg-box">
<div class="lg-logo">پ</div>
<h2 style="margin-bottom:4px">پارچه‌بان</h2>
<p style="color:var(--txs);font-size:.85rem;margin-bottom:24px">سیستم مدیریت انبار و فروش</p>
<div class="fg"><label>نام کاربری</label><input class="fc" id="loginUser" placeholder="نام کاربری"></div>
<div class="fg"><label>رمز عبور</label><input class="fc" id="loginPass" type="password" placeholder="پیش‌فرض: admin123"></div>
<button class="btn bp" style="width:100%;padding:12px;font-size:.95rem" onclick="Auth.login()">ورود</button>

<script>
var STATE={yearId:null,userId:null,username:''};
var currentPage='dashboard';

function switchYear(id){STATE.yearId=parseInt(id);localStorage.setItem('pb_year',STATE.yearId);var r=ROUTES[currentPage];if(r)r();}
function doSearch(){var q=document.getElementById('searchInput').value.trim().toLowerCase();document.querySelectorAll('#mainContent tbody tr').forEach(function(tr){tr.style.display=!q||tr.textContent.toLowerCase().indexOf(q)>-1?'':'none';});}

/* ══ DB ══ */
var DB={db:null,
init:function(){return new Promise(function(ok,no){var r=indexedDB.open('parchehban_v7',1);
r.onupgradeneeded=function(e){var d=e.target.result;['categories','products','contacts','invoices','payments','checks','fiscalYears','yearOpenings','users'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true});});};
r.onsuccess=function(e){DB.db=e.target.result;ok();};r.onerror=function(e){no(e.target.error);};});},
gs:function(n,m){return this.db.transaction(n,m||'readonly').objectStore(n);},
all:function(n){return new Promise(function(ok){var r=DB.gs(n).getAll();r.onsuccess=function(){ok(r.result);};});},
get:function(n,id){return new Promise(function(ok){var r=DB.gs(n).get(id);r.onsuccess=function(){ok(r.result);};});},
add:function(n,d){return new Promise(function(ok){d.createdAt=new Date().toISOString();var r=DB.gs(n,'readwrite').add(d);r.onsuccess=function(){ok(r.result);};});},
put:function(n,d){return new Promise(function(ok){d.updatedAt=new Date().toISOString();var r=DB.gs(n,'readwrite').put(d);r.onsuccess=function(){ok(r.result);};});},
del:function(n,id){return new Promise(function(ok){var r=DB.gs(n,'readwrite').delete(id);r.onsuccess=function(){ok();};});},
cnt:function(n){return new Promise(function(ok){var r=DB.gs(n).count();r.onsuccess=function(){ok(r.result);};});}
};

/* ══ AUTH ══ */
var Auth = {
  hash: function(p) { return btoa(unescape(encodeURIComponent(p + '_pb7_salt'))); },

  login: async function() {
    try {
      var errEl = document.getElementById('loginErr');
      if (!DB.db) {
        errEl.textContent = 'دیتابیس آماده نیست — صفحه را رفرش کنید (Ctrl+F5)';
        errEl.style.display = 'block';
        return;
      }
      var u = document.getElementById('loginUser').value.trim();
      var p = document.getElementById('loginPass').value;
      if (!u || !p) {
        errEl.textContent = 'نام کاربری و رمز را وارد کنید';
        errEl.style.display = 'block';
        return;
      }
      var users = await DB.all('users');
      console.log('Users count:', users.length, '| Input:', u, '| Pass len:', p.length);
      var hash = Auth.hash(p);
      var user = users.find(function(x) { return x.username === u && x.password === hash; });
      if (!user) {
        /* show helpful debug */
        if (users.length === 0) {
          errEl.textContent = 'هیچ کاربری وجود ندارد. صفحه را رفرش کنید.';
        } else {
          errEl.textContent = 'نام کاربری یا رمز عبور اشتباه است (کیبورد انگلیسی؟)';
        }
        errEl.style.display = 'block';

/* ══ DATE HELPERS ══ */
function pn(s) {
  if (!s) return 0;
  var c = s.replace(/[۰-۹]/g, function(ch) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(ch); });
  var p = c.split('/');
  if (p.length < 3) return 0;
  return parseInt(p[0]) * 10000 + parseInt(p[1]) * 100 + parseInt(p[2]);
}
function getPeriodStart(pr) {
  var now = new Date(), ps = now.toLocaleDateString('fa-IR');
  var c = ps.replace(/[۰-۹]/g, function(ch) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(ch); });
  var p = c.split('/'), y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]);
  if (pr === 'week') { d -= 7; if (d < 1) { m--; d += 30; } if (m < 1) { y--; m += 12; } }
  else if (pr === 'month') { m--; if (m < 1) { y--; m += 12; } }
  else { y--; }
  return y * 10000 + m * 100 + d;
}

/* ══ DASHBOARD ══ */
var Dash = {
  period: 'month',

  render: async function() {
    currentPage = 'dashboard'; UI.nav('dashboard'); UI.title('bi-grid-1x2-fill', 'داشبورد'); UI.act('');
    UI.content('<div class="ld"><div class="spn"></div></div>');
    await this.load();
  },

  setP: async function(p) { this.period = p; await this.load(); },

  load: async function() {
    var contacts = await DB.all('contacts');
    var allInvs = await FY.byYear('invoices');
    var allPays = await FY.byYear('payments');
    var allChks = await FY.byYear('checks');
    var cMap = {}; contacts.forEach(function(c) { cMap[c.id] = c.name; });

    var startNum = getPeriodStart(this.period);
    var periodInvs = allInvs.filter(function(inv) { return pn(inv.date) >= startNum; });

    var tPur = 0, tSal = 0, tShip = 0;
    periodInvs.forEach(function(v) {
      if (v.type === 'purchase') tPur += v.grandTotal || 0;
      else tSal += v.grandTotal || 0;
      tShip += v.shippingCost || 0;
    });
    var profit = tSal - tPur - tShip;

    var custN = contacts.filter(function(c) { return c.type === 'customer' || c.type === 'both'; }).length;
    var suppN = contacts.filter(function(c) { return c.type === 'supplier' || c.type === 'both'; }).length;
    var brokN = contacts.filter(function(c) { return c.type === 'broker'; }).length;

    /* profit by customer */
    var costMap = {};
    allInvs.forEach(function(inv) {
      if (inv.type === 'purchase') (inv.items || []).forEach(function(it) {
        if (!costMap[it.productId]) costMap[it.productId] = { cost: 0, qty: 0 };
        costMap[it.productId].cost += it.total || 0;
        costMap[it.productId].qty += it.quantity || 0;
      });
    });
    var custP = {};
    periodInvs.forEach(function(inv) {
      if (inv.type !== 'sale') return;
      var cid = inv.contactId;
      if (!custP[cid]) custP[cid] = { name: cMap[cid] || '—', revenue: 0, cost: 0 };
      (inv.items || []).forEach(function(it) {
        custP[cid].revenue += it.total || 0;
        var cm = costMap[it.productId];
        var avg = cm && cm.qty > 0 ? cm.cost / cm.qty : 0;
        custP[cid].cost += avg * (it.quantity || 0);
      });
    });
    var cpArr = [];
    for (var k in custP) { var cp = custP[k]; cp.profit = cp.revenue - cp.cost; cpArr.push(cp); }
    cpArr.sort(function(a, b) { return b.profit - a.profit; });

    var lastChks = allChks.sort(function(a, b) { return (b.id||0)-(a.id||0); }).slice(0, 5);
    var lastInvs = allInvs.sort(function(a, b) { return (b.id||0)-(a.id||0); }).slice(0, 5);

    /* ── build ── */
    var pl = { week: 'هفته اخیر', month: 'ماه اخیر', year: 'سال مالی' };
    var me = this, h = '';

    /* period buttons */
    h += '<div style="display:flex;gap:8px;margin-bottom:20px;align-items:center;flex-wrap:wrap">';
    h += '<span style="font-weight:600;font-size:.85rem;color:var(--txs)">دوره:</span>';
    ['week','month','year'].forEach(function(p) {
      h += '<button class="btn ' + (me.period===p?'bp':'bo') + ' bs" onclick="Dash.setP(\''+p+'\')">' + pl[p] + '</button>';
    });
    h += '</div>';

    /* stats cards */
    h += '<div class="sg">';
    h += '<div class="sc"><div class="si '+(profit>=0?'g':'r')+'"><i class="bi bi-graph-up"></i></div><div class="sti"><h3>'+UI.fn(profit)+'</h3><p>سود/زیان ('+pl[this.period]+')</p></div></div>';
    h += '<div class="sc"><div class="si o"><i class="bi bi-cart-fill"></i></div><div class="sti"><h3>'+UI.fn(tPur)+'</h3><p>کل خرید (ریال)</p></div></div>';
    h += '<div class="sc"><div class="si g"><i class="bi bi-receipt-cutoff"></i></div><div class="sti"><h3>'+UI.fn(tSal)+'</h3><p>کل فروش (ریال)</p></div></div>';
    h += '<div class="sc"><div class="si b"><i class="bi bi-people-fill"></i></div><div class="sti"><h3>'+contacts.length+'</h3><p>'+custN+' مشتری · '+suppN+' تأمین · '+brokN+' واسطه</p></div></div>';
    h += '</div>';

    /* profit by customer */
    h += '<div class="cd" style="margin-bottom:20px"><div class="cd-h"><i class="bi bi-person-lines-fill" style="margin-left:8px"></i>سود/زیان بر اساس مشتری ('+pl[this.period]+')</div>';
    if (cpArr.length) {
      h += '<div class="tw"><table><thead><tr><th>#</th><th>مشتری</th><th>فروش</th><th>بهای تمام شده</th><th>سود</th></tr></thead><tbody>';
      cpArr.forEach(function(cp, i) {
        h += '<tr><td>'+(i+1)+'</td><td><strong>'+cp.name+'</strong></td><td>'+UI.fn(Math.round(cp.revenue))+'</td><td>'+UI.fn(Math.round(cp.cost))+'</td>';
        h += '<td style="color:'+(cp.profit>=0?'var(--ok)':'var(--d)')+';font-weight:700">'+UI.fn(Math.round(cp.profit))+'</td></tr>';

_br:async function(w){var ct=await DB.all('contacts'),invs=await FY.byYear('invoices'),pays=await FY.byYear('payments');var res=[];for(var ci=0;ci<ct.length;ci++){var c=ct[ci];var bal=await getOpenBal(c.id);invs.forEach(function(inv){if(inv.contactId===c.id)bal+=inv.type==='sale'?inv.grandTotal:-inv.grandTotal;if(inv.brokerId===c.id&&inv.brokerCommission)bal-=inv.brokerCommission;});pays.forEach(function(pay){if(pay.contactId===c.id)bal+=pay.type==='payment'?pay.amount:-pay.amount;});if(w==='debtors'&&bal>0)res.push({name:c.name,type:c.type,bal:bal});if(w==='creditors'&&bal<0)res.push({name:c.name,type:c.type,bal:bal});}res.sort(function(a,b){return Math.abs(b.bal)-Math.abs(a.bal);});var lb=w==='debtors'?'بدهکاران':'بستانکاران';var cH=['نام','نوع','مانده'];var cR=[];var tr='';var tot=0;res.forEach(function(r,i){tot+=r.bal;cR.push([r.name,Con.tl(r.type),Math.abs(r.bal)]);tr+='<tr><td>'+(i+1)+'</td><td><strong>'+r.name+'</strong></td><td><span class="tg '+Con.tt(r.type)+'">'+Con.tl(r.type)+'</span></td><td style="font-weight:700;color:var('+(w==='debtors'?'d':'ok')+')">'+UI.fn(Math.abs(r.bal))+' ریال</td></tr>';});this._c={csvH:cH,csvR:cR};var h='<div style="display:flex;gap:10px;margin-bottom:16px"><button class="btn bg" onclick="EXP.csv(Rep._c.csvH,Rep._c.csvR,\''+lb+'.csv\')"><i class="bi bi-download"></i>Excel</button></div>';h+='<div class="cd"><div class="cd-h">'+lb+' <span class="tg '+(w==='debtors'?'tg-r':'tg-g')+'" style="margin-right:8px">'+res.length+' نفر — '+UI.fn(Math.abs(tot))+' ریال</span></div>';if(res.length)h+='<div class="tw"><table><thead><tr><th>#</th><th>نام</th><th>نوع</th><th>مانده</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';else h+='<div class="em"><p>موردی نیست</p></div></div>';document.getElementById('rC').innerHTML=h;}};
